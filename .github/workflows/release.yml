# On a published release: build the runtime image (Dockerfile: cvc5 from source, so expect a long
# build) and push it to the GitHub Container Registry under the release tag, so that
#   docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" ghcr.io/gaborkoncz73/halo2-analyzer-fork:v1.0.0 reproduce
# runs the version Zenodo archived. Zenodo archives the release itself.
name: release
on:
  release: { types: [published] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}" }
